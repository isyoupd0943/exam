<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IS YOU · 학교별 시험 분석 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue-1:#dbeafe; --blue-2:#bfdbfe; --blue-3:#93c5fd; --blue-4:#4C8BF5;
  --blue-ink:#2563eb; --blue-deep:#1d4ed8;
  --sky-fill:#cfe3fb;
  --donut-blue-d:#5b8ec9; --donut-blue-l:#9db2d5;
  --donut-purple-d:#8b7cb8; --donut-purple-m:#c7badd; --donut-purple-l:#e1d8eb;
  --donut-green-d:#7cb083; --donut-green-m:#a9cfa6; --donut-green-l:#dcefda;
  --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --bar-37:#4285F4; --bar-38:#EA4335; --bar-39:#FBBC04; --bar-40:#34A853;
  --bar-41:#FF6D00; --bar-6:#46BDC6; --bar-7:#4C8BF5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#eef4fc;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;font-size:12px}
.stepbar .s{padding:5px 11px;border-radius:999px;background:#fff;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.stepbar .s.on{background:var(--blue-ink);color:#fff;border-color:var(--blue-ink);font-weight:700}
.stepbar .s.done{background:var(--blue-1);color:var(--blue-deep);border-color:var(--blue-2)}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(37,99,235,.06);margin-bottom:18px}
.card h2{font-size:21px;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
input[type=text],input[type=tel],textarea,select{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;transition:.15s;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue-4);box-shadow:0 0 0 3px rgba(76,139,245,.15)}
textarea{resize:vertical;min-height:96px}
select:disabled{background:#f3f4f6;color:#9ca3af;cursor:not-allowed}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:12px 22px;border:none;border-radius:10px;font-family:inherit;font-size:15px;
  font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--blue-ink);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}
.btn.ghost{background:#fff;color:var(--blue-ink);border:1.5px solid var(--blue-2)}
.btn.ghost:hover{background:var(--blue-1)}
.btn.lg{width:100%;padding:15px;font-size:16px}
.btn-row{display:flex;gap:10px;margin-top:24px}
.btn-row .btn{flex:1}
.level-block{margin-bottom:18px}
.level-block h3{font-size:16px;color:var(--blue-deep);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.level-block h3::before{content:"";width:4px;height:18px;background:var(--blue-4);border-radius:2px}
.subj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.subj-btn{padding:26px 10px;border:1.5px solid var(--blue-2);border-radius:14px;background:#fff;
  font-size:17px;font-weight:700;color:var(--blue-deep);cursor:pointer;transition:.15s}
.subj-btn:hover{background:var(--blue-ink);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.22)}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.data-table th{background:#f3f4f6;padding:9px 8px;border:1px solid var(--line);font-size:12.5px}
.data-table td{border:1px solid var(--line);padding:0}
.data-table td input,.data-table td select{border:none;border-radius:0;padding:9px 8px;text-align:center;background:transparent}
.data-table td input:focus,.data-table td select:focus{box-shadow:inset 0 0 0 2px var(--blue-4)}
.addrow{margin-top:10px;font-size:13px;color:var(--blue-ink);background:none;border:1px dashed var(--blue-3);padding:8px 14px;border-radius:8px;cursor:pointer}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.cmp-table th{background:#f3f4f6;border:1px solid var(--line);padding:8px 4px;font-size:11.5px;text-align:center}
.cmp-table td{border:1px solid var(--line);padding:4px;text-align:center}
.cmp-table .schoolname input{text-align:center;font-weight:700;padding:6px;font-size:12.5px}
.cmp-table input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue-4);cursor:pointer}
.cmp-grad td.schoolname{color:#1e3a5f}
.report-toolbar{position:sticky;top:0;z-index:20;background:#eef4fc;padding:12px 0;display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px}
.page{background:#fff;width:794px;min-height:1123px;margin:0 auto 22px;padding:54px 60px;box-shadow:0 6px 28px rgba(0,0,0,.10);position:relative;page-break-after:always}
.page-num{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#9ca3af;font-size:12px}
.rep-head{border-bottom:2px solid var(--blue-2);padding-bottom:10px;margin-bottom:26px}
.rep-head h1{font-size:25px;color:#1e293b;letter-spacing:-.5px}
.rep-head .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.sec-title{font-size:20px;margin:6px 0 16px;color:#1e293b}
.body-text{font-size:14px;line-height:1.95;color:#374151;white-space:pre-wrap}
.cover{background:linear-gradient(165deg,#eaf2fe 0%,#dbeafe 60%,#cfe3fb 100%);display:flex;flex-direction:column;overflow:hidden}
.cover-card{background:rgba(255,255,255,.78);border-radius:22px;margin:54px 48px 0;padding:40px 44px;position:relative;box-shadow:0 14px 40px rgba(37,99,235,.13);max-width:560px}
.cover-tag{display:inline-block;background:var(--blue-3);color:#fff;font-size:14px;font-weight:700;padding:5px 16px;border-radius:8px 8px 8px 0;margin-bottom:14px}
.cover-card h1{font-family:'Black Han Sans',sans-serif;font-size:62px;line-height:1.08;color:var(--blue-ink);letter-spacing:1px}
.cover-pill{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--blue-3);border-radius:999px;padding:9px 20px;color:var(--blue-deep);font-weight:700;font-size:17px;margin-top:18px}
.cover-pill .arr{width:26px;height:26px;border-radius:50%;background:var(--blue-ink);color:#fff;display:grid;place-items:center;font-size:14px}
.cover-desc{color:var(--blue-deep);font-weight:500;font-size:15px;margin-top:18px;line-height:1.7}
.cover-meta{display:flex;gap:44px;justify-content:center;margin:54px 0 0;color:#334155;font-weight:700;font-size:15px;flex-wrap:wrap}
.skyline{margin-top:auto;height:200px;width:100%}
.cover-logo-box{text-align:center;margin-top:30px}
.logo-ph{display:inline-flex;flex-direction:column;align-items:center;gap:4px;color:#1e293b}
.logo-ph .mark{width:72px;height:72px;border:2px dashed #94a3b8;border-radius:12px;display:grid;place-items:center;color:#94a3b8;font-size:11px;text-align:center;line-height:1.2}
.backcover{background:linear-gradient(180deg,#fff 0%,#fff 55%,#eaf3ff 100%);display:flex;flex-direction:column;overflow:hidden}
.backcover .bc-top h2{font-size:15px;font-weight:700;color:#334155}
.backcover .bc-top h1{font-family:'Black Han Sans',sans-serif;font-size:40px;color:#334155;margin-top:4px}
.backcover .bc-center{margin:auto;text-align:center}
.backcover .tel{font-weight:700;font-size:19px;color:#1e293b;margin-top:22px}
.rep-cmp{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.rep-cmp th{background:#f3f4f6;border:1px solid #d1d5db;padding:9px 4px;font-size:11px;text-align:center;font-weight:700}
.rep-cmp td{border:1px solid #d1d5db;padding:7px 4px;text-align:center;height:30px}
.rep-cmp td.sn{font-weight:700;color:#1e3a5f}
.rep-note{font-size:11.5px;color:var(--muted);margin-top:6px}
.rep-detail{width:100%;border-collapse:collapse;font-size:12.5px}
.rep-detail th{background:#f3f4f6;border:1px solid #d1d5db;padding:8px;font-weight:700}
.rep-detail td{border:1px solid #d1d5db;padding:7px 8px;text-align:center}
.rep-cross{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px}
.rep-cross th{background:#f3f4f6;border:1px solid #d1d5db;padding:9px;font-weight:700}
.rep-cross td{border:1px solid #d1d5db;padding:8px;text-align:center}
.rep-cross tr:last-child td,.rep-cross td.tot{background:#eef0f3;font-weight:700}
.chart-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:8px 0 26px}
.chart-box{border:1px solid var(--line);border-radius:12px;padding:14px}
.chart-box h4{text-align:center;font-size:14px;margin-bottom:6px}
.chart-1{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.chart-1 h4{text-align:center;font-size:15px;margin-bottom:8px}
.score-band{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;margin-bottom:8px}
.band-info h4{font-size:15px;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--blue-4)}
.band-info p{font-size:13px;color:#374151;margin-bottom:10px;line-height:1.7}
.band-info .li{font-size:13.5px;margin:3px 0}
.notice{background:#fef9e7;border:1px solid #f7e9a0;border-radius:10px;padding:12px 16px;font-size:13px;color:#7a6320;margin-top:14px}
.access-screen{max-width:460px;margin:80px auto;text-align:center}
.access-screen .lock{font-size:46px;margin-bottom:10px}
.spinner{width:46px;height:46px;border:4px solid var(--blue-1);border-top-color:var(--blue-ink);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:99}
.toast.show{opacity:1}
.dev-note{background:#1e293b;color:#cbd5e1;border-radius:10px;padding:10px 16px;font-size:12px;margin-bottom:16px;line-height:1.6}
.dev-note b{color:#7dd3fc}
/* ── 단원 다중선택 드롭다운 ── */
.ms-box{position:relative}
.ms-control{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff}
.ms-control.open{border-color:var(--blue-4);box-shadow:0 0 0 3px rgba(76,139,245,.15)}
.ms-control.disabled{background:#f3f4f6;cursor:not-allowed}
.ms-ph{color:#9ca3af;font-size:14px}
.ms-chip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-1);color:var(--blue-deep);
  border:1px solid var(--blue-2);border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:700}
.ms-chip .x{cursor:pointer;font-weight:900;opacity:.6}
.ms-chip .x:hover{opacity:1}
.ms-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:#fff;border:1.5px solid var(--blue-2);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto;padding:6px}
.ms-opt{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.ms-opt:hover{background:var(--blue-1)}
.ms-opt input{width:17px;height:17px;accent-color:var(--blue-4);margin:0}
.ms-empty{padding:14px;text-align:center;color:#9ca3af;font-size:13px}
@media print{
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .stepbar,.report-toolbar,.dev-note{display:none!important}
  .page{box-shadow:none;margin:0;width:auto;min-height:100vh}
}
@media(max-width:840px){
  .page{width:100%;padding:30px 22px}
  .subj-grid{grid-template-columns:repeat(2,1fr)}
  .chart-2col,.score-band{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   IS YOU 학교별 시험 분석 — 웹 (Apps Script 백엔드 연동)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxW00deCfypCsAC4KHggLbyozAA_W7PKy58zawD46BXgRVBMjpf_-xnj4HR5f2JRbS8OA/exec";
const DEMO = !API_URL;

async function apiGet(params){
  if(DEMO) return demoGet(params);
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(API_URL+"?"+qs);
  return r.json();
}
async function apiPost(body){
  if(DEMO) return demoPost(body);
  const r = await fetch(API_URL,{method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body)});
  return r.json();
}

// 단원/영역 라벨(과목별): 수·과='단원명', 영·국='영역'
function unitLabelOf(subject){
  return (CURRICULUM[subject] && CURRICULUM[subject]._areaLabel) ? CURRICULUM[subject]._areaLabel : "단원명";
}
// 세부과목 목록
function subjectsOf(subject, level, grade){
  const node = CURRICULUM[subject] && CURRICULUM[subject][level] && CURRICULUM[subject][level][grade];
  return node ? Object.keys(node) : [];
}
// 단원/영역 목록(세부과목 기준)
function unitsOf(subject, level, grade, detail){
  const node = CURRICULUM[subject] && CURRICULUM[subject][level] && CURRICULUM[subject][level][grade];
  if(!node || !node[detail]) return [];
  let v = node[detail];
  if(v === "_areas") v = CURRICULUM[subject]._areas;
  return Array.isArray(v) ? v.slice() : [];
}

function demoGet(p){
  if(p.action==="access") return Promise.resolve(DEMO_WL.includes(p.sheetId)?{ok:true,userId:"demo-user"}:{ok:false,error:"not whitelisted"});
  if(p.action==="lastcompare"){
    const recs=_demoRecs().filter(r=>r.grade===p.grade && r.subject===p.subject);
    const last=recs.length?recs[recs.length-1]:null;
    return Promise.resolve({ok:true, compare:last?last.data.compare:null});
  }
  if(p.action==="list"){
    const recs=_demoRecs().filter(r=>r.groupKey===p.groupKey).map(r=>({id:r.id, createdAt:r.createdAt})).reverse();
    return Promise.resolve({ok:true, reports:recs});
  }
  if(p.action==="report"||p.action==="get"){
    const rec=_demoRecs().find(x=>x.id===p.id);
    if(!rec) return Promise.resolve({ok:p.action==="get",found:false});
    const out={id:rec.id,groupKey:rec.groupKey,school:rec.school,grade:rec.grade,subject:rec.subject,
      detail:rec.detail,units:rec.units,target:rec.target,s2:rec.s2,s3:rec.s3,s5:rec.s5,createdAt:rec.createdAt,data:rec.data};
    return Promise.resolve(p.action==="report"?{ok:true,record:out,readonly:true}:{ok:true,found:true,record:out});
  }
  return Promise.resolve({ok:false});
}

  STATE.level=lv; STATE.subject=s; STATE.view="input";
  STATE.info={}; STATE.rows=[]; STATE.sections={}; STATE.compare=null;
  STATE.unitsSel=[]; STATE._skipDup=false;

}

// 학년 변경 → 세부과목 목록 갱신, 하위(세부·단원) 초기화
function onGradeChange(){
  STATE.info.grade = $("#f_grade").value;
  STATE.info.subject = "";
  STATE.unitsSel = [];
  const lv=STATE.level, s=STATE.subject, g=STATE.info.grade;
  const sel=$("#f_subject");
  const list = g ? subjectsOf(s,lv,g) : [];
  sel.disabled = !g;
  sel.innerHTML = `<option value="">${g?'세부과목 선택':'학년 먼저 선택'}</option>`
    + list.map(d=>`<option>${d}</option>`).join("");
  renderUnitMs();
  loadCompareArea();
}

// 세부과목 변경 → 단원/영역 목록 갱신
function onDetailChange(){
  STATE.info.subject = $("#f_subject").value;
  STATE.unitsSel = [];
  renderUnitMs();
}

// 학교명/학년 변경 시 비교표 갱신 (학교명 input용)
async function onKeyFieldChange(){
  STATE.info.school=$("#f_school").value.trim();
  STATE.compare=null;
  await loadCompareArea();
}

// ── 단원 다중선택 컴포넌트 ──
function currentUnitOptions(){
  return unitsOf(STATE.subject, STATE.level, STATE.info.grade, STATE.info.subject);
}
function renderUnitMs(){
  const box=$("#unitMsBox"); if(!box) return;
  const opts=currentUnitOptions();
  const unitLabel=unitLabelOf(STATE.subject);
  if(!STATE.info.subject || !opts.length){
    box.innerHTML=`<div class="ms-control disabled"><span class="ms-ph">학년·세부과목을 먼저 선택하세요</span></div>`;
    return;
  }
  const chips = STATE.unitsSel.length
    ? STATE.unitsSel.map(u=>`<span class="ms-chip">${esc(u)}<span class="x" onclick="event.stopPropagation();removeUnit('${esc(u)}')">×</span></span>`).join("")
    : `<span class="ms-ph">${unitLabel} 선택 (여러 개 가능)</span>`;
  box.innerHTML=`
    <div class="ms-box">
      <div class="ms-control" id="msControl" onclick="toggleUnitMenu()">${chips}</div>
      <div class="ms-menu" id="msMenu" style="display:none">
        ${opts.map(o=>`
          <label class="ms-opt" onclick="event.stopPropagation()">
            <input type="checkbox" ${STATE.unitsSel.includes(o)?'checked':''} onchange="toggleUnit('${esc(o)}',this.checked)">
            <span>${esc(o)}</span>
          </label>`).join("")}
      </div>
    </div>`;
}
function toggleUnitMenu(){
  const m=$("#msMenu"), c=$("#msControl");
  if(!m) return;
  const open = m.style.display==="none";
  m.style.display = open?"block":"none";
  c.classList.toggle("open", open);
}
function toggleUnit(u, on){
  if(on){ if(!STATE.unitsSel.includes(u)) STATE.unitsSel.push(u); }
  else { STATE.unitsSel = STATE.unitsSel.filter(x=>x!==u); }
  // 칩만 갱신(메뉴는 열린 상태 유지)
  const c=$("#msControl");
  const unitLabel=unitLabelOf(STATE.subject);
  c.innerHTML = STATE.unitsSel.length
    ? STATE.unitsSel.map(x=>`<span class="ms-chip">${esc(x)}<span class="x" onclick="event.stopPropagation();removeUnit('${esc(x)}')">×</span></span>`).join("")
    : `<span class="ms-ph">${unitLabel} 선택 (여러 개 가능)</span>`;
}
function removeUnit(u){
  STATE.unitsSel = STATE.unitsSel.filter(x=>x!==u);
  renderUnitMs();
}
// 바깥 클릭 시 메뉴 닫기
document.addEventListener("click",(e)=>{
  const box=document.querySelector(".ms-box");
  if(box && !box.contains(e.target)){
    const m=$("#msMenu"); if(m){ m.style.display="none"; $("#msControl")?.classList.remove("open"); }
  }
});

// ── 난이도 비교표 ──
async function loadCompareArea(){
  const grade=STATE.info.grade||($("#f_grade")?$("#f_grade").value:"");
  const school=$("#f_school")?$("#f_school").value.trim():(STATE.info.school||"");
  if(!grade){ return; }
  const area=$("#cmpArea"); if(!area) return;
  area.innerHTML=`<p class="hint" style="padding:14px 0">불러오는 중…</p>`;

  let schools, fromPrev=false;
  if(STATE.compare){ schools=STATE.compare.schools.map(s=>({name:s.name,checks:s.checks.slice()})); }
  else {
    const meta=await apiGet({action:"lastcompare",sheetId:STATE.sheetId,grade:grade,subject:STATE.subject});
    const prev=meta.compare;
    if(prev && prev.schools && prev.schools.length){
      schools=prev.schools.map(p=>({name:p.name,checks:p.checks.slice()})); fromPrev=true;
    } else { schools=[]; }
  }
  let added=false;
  if(school && !schools.some(s=>s.name===school)){
    schools.push({name:school,checks:[false,false,false,false,false,false]}); added=true;
  }
  STATE.compare={schools};
  const hint=$("#cmpHint");
  if(hint) hint.innerHTML = (fromPrev
    ? `✓ ${esc(grade)} ${esc(STATE.subject)} 과거 비교표를 불러왔습니다. 난이도 체크는 수정할 수 있습니다.`
    : `해당 학년·과목의 과거 리포트가 없어 빈 표로 시작합니다.`)
    + (added?` 이번 분석 학교 <b>${esc(school)}</b>를 맨 아래에 추가했습니다.`:'');
  area.innerHTML=compareGridHTML({schools});
}
const CMP_GRAD=["#dbe7fb","#c9def8","#e9f0c9","#f2f6cf","#dff0a8","#cfe88a"];
function academyBooks(){ return (STATE.academy&&STATE.academy.books)||["하","중하","중","중상","상","최상"]; }
function compareGridHTML(cmp){
  const books=academyBooks();
  const me=$("#f_school")?$("#f_school").value.trim():STATE.info.school;
  return `<table class="cmp-table" id="cmpGrid">
    <thead><tr><th style="width:170px">주변 학교 시험 난이도<br>(시중교재 난이도)</th>
      ${books.map((b,i)=>`<th style="background:${CMP_GRAD[i]}">${esc(b)}</th>`).join("")}</tr></thead>
    <tbody>${cmp.schools.map((sc,r)=>`<tr>
      <td class="schoolname"><input type="text" value="${esc(sc.name)}" data-r="${r}" data-name
        ${sc.name===me?'style="background:#eaf2fe;font-weight:800"':''}></td>
      ${sc.checks.map((ck,c)=>`<td><input type="checkbox" data-r="${r}" data-c="${c}" ${ck?'checked':''}></td>`).join("")}
    </tr>`).join("")}</tbody></table>
    <button class="addrow" onclick="addCmpRow()" type="button">+ 학교 추가</button>
    <p class="rep-note">※ 시험 난이도는 작성자의 주관이 담겨있으므로 절대적인 지표가 아님을 알려드립니다.</p>`;
}
function addCmpRow(){
  const cur=readCompare();
  cur.schools.push({name:"",checks:[false,false,false,false,false,false]});
  STATE.compare=cur; $("#cmpArea").innerHTML=compareGridHTML(cur);
}
function readCompare(){
  const rows=document.querySelectorAll('#cmpGrid tbody tr');
  const schools=Array.from(rows).map(()=>({name:"",checks:[false,false,false,false,false,false]}));
  document.querySelectorAll('#cmpGrid input[data-name]').forEach(inp=>{schools[+inp.dataset.r].name=inp.value;});
  document.querySelectorAll('#cmpGrid input[type=checkbox]').forEach(cb=>{schools[+cb.dataset.r].checks[+cb.dataset.c]=cb.checked;});
  return {schools};
}
function backToSubject(){ STATE.subject=null; STATE.view=null; STATE.compare=null; STATE.unitsSel=[]; render(); }

function onFilePick(ev){
  const f=ev.target.files[0]; if(!f) return;
  STATE.fileName=f.name; STATE.fileMime=f.type||"application/pdf";
  const rd=new FileReader();
  rd.onload=()=>{ STATE.fileBase64=String(rd.result).split(",")[1]; $("#fileInfo").textContent="선택됨: "+f.name; };
  rd.readAsDataURL(f);
}

function groupKeyOf(){ return `${STATE.info.school}_${STATE.info.grade}_${STATE.subject}`; }

async function goAnalyze(){
  // ★ units는 다중선택 배열(STATE.unitsSel)에서 가져온다
  STATE.info={
    school:$("#f_school").value.trim(),
    grade:$("#f_grade").value,
    subject:$("#f_subject").value,
    units:STATE.unitsSel.slice(),      // 배열
    target:$("#f_target").value.trim()
  };
  if(!STATE.info.school||!STATE.info.grade){ return toast("학년과 학교명은 필수입니다."); }
  if(!STATE.info.subject){ return toast("세부 과목명을 선택해 주세요."); }
  if(!STATE.info.units.length){ return toast(unitLabelOf(STATE.subject)+"을(를) 1개 이상 선택해 주세요."); }
  if($("#cmpGrid")) STATE.compare=readCompare();
  STATE.groupKey=groupKeyOf();

  if(!DEMO && !STATE.fileBase64){ return toast("시험지 파일을 업로드해 주세요."); }

  if(!STATE._skipDup){
    const lst=await apiGet({action:"list",sheetId:STATE.sheetId,groupKey:STATE.groupKey});
    if(lst.ok && lst.reports && lst.reports.length){
      STATE._pendingList=lst.reports; STATE.view="exists"; return render();
    }
  }
  await runAnalyze();
}

async function runAnalyze(){
  STATE._skipDup=false;
  loadingScreen("Gemini가 시험지를 분석하고 있습니다…");
  const res=await apiPost({action:"analyze", prompt:buildAnalyzePrompt(),
    fileBase64:STATE.fileBase64, mimeType:STATE.fileMime});
  if(!res.ok){ toast("분석 오류: "+(res.error||"")); STATE.view="input"; return render(); }
  try{ STATE.rows=JSON.parse(String(res.raw).replace(/```json|```/g,"").trim()); }
  catch(e){ toast("분석 결과 파싱 실패"); STATE.view="input"; return render(); }
  STATE.view="raw"; render();
}
function loadingScreen(msg){
  app.innerHTML=`<div class="card" style="text-align:center;padding:60px">
    <div class="spinner"></div><p style="color:var(--muted)">${msg}</p></div>`;
}

// ---------- 3-1. 기존 기록 선택 ----------
function renderExists(){
  app.innerHTML=stepbar(2)+`<div class="card" style="text-align:center;padding:48px 36px">
    <div style="font-size:40px;margin-bottom:10px">🗂️</div>
    <h2>이 학교는 이미 분석한 기록이 있습니다</h2>
    <p class="sub" style="margin-bottom:8px">${esc(STATE.info.school)} · ${esc(STATE.info.grade)} · ${esc(STATE.subject)}
      <br>기존 기록 ${STATE._pendingList.length}건</p>
    <div class="btn-row" style="max-width:520px;margin:26px auto 0">
      <button class="btn ghost" onclick="STATE.view='list';render()">기존 리포트 보기</button>
      <button class="btn primary" onclick="STATE._skipDup=true;runAnalyze()">새로 분석하기</button>
    </div>
    <div style="margin-top:18px"><button class="btn ghost" onclick="STATE.view='input';render()">← 입력으로 돌아가기</button></div>
  </div>`;
}
function renderHistoryList(){
  const list=STATE._pendingList||[];
  app.innerHTML=stepbar(2)+`<div class="card">
    <h2>기존 리포트 목록</h2>
    <p class="sub">${esc(STATE.info.school)} · ${esc(STATE.info.grade)} · ${esc(STATE.subject)} — 생성일시를 눌러 해당 리포트를 엽니다.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      ${list.map(r=>`<button class="btn ghost" style="justify-content:space-between;text-align:left"
        onclick="openHistory('${r.id}')">
        <span>📄 ${fmtDate(r.createdAt)} 생성</span><span style="color:var(--blue-ink)">열기 →</span></button>`).join("")}
    </div>
    <div class="btn-row" style="margin-top:24px">
      <button class="btn ghost" onclick="STATE.view='exists';render()">← 뒤로</button>
      <button class="btn primary" onclick="STATE._skipDup=true;runAnalyze()">새로 분석하기</button>
    </div>
  </div>`;
}
function fmtDate(iso){
  try{ const d=new Date(iso); const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }catch(e){ return iso; }
}
async function openHistory(id){
  loadingScreen("리포트를 불러오는 중…");
  const res=await apiGet({action:"get",sheetId:STATE.sheetId,id:id});
  if(!res.found){ toast("리포트를 찾을 수 없습니다."); STATE.view="list"; return render(); }
  const r=res.record;
  STATE.reportId=r.id; STATE.groupKey=r.groupKey;
  STATE.info={school:r.school,grade:r.grade,subject:r.detail,
    units:Array.isArray(r.units)?r.units:(r.units? String(r.units).split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[]),
    target:r.target};
  STATE.unitsSel=STATE.info.units.slice();
  STATE.rows=r.data.rows||[]; STATE.compare=r.data.compare||{schools:[]};
  STATE.sections={s2:r.s2,s3:r.s3,s5:r.s5};
  if(r.data.academy) STATE.academy=r.data.academy;
  STATE.view="report"; render();
}

// ---------- 4. 난이도 검토/수정 ----------
const TYPES=["개념형","계산형","추론형","복합형"];
const SCI_TYPES=["개념형","계산형","자료해석형","복합형"];
const DIFFS=["하","중하","중","중상","상"];      // ★ 난이도 5단계
function typeOptionsFor(){
  return STATE.subject==="과학" ? SCI_TYPES : (STATE.subject==="수학" ? TYPES : null);
}
function renderRawEdit(){
  const unitLabel=unitLabelOf(STATE.subject);
  const typeOpts=typeOptionsFor(); // 영어/국어는 type 대신 unit(영역)이 핵심이라 자유 표시
  app.innerHTML=stepbar(3)+`<div class="card">
    <h2>기초 데이터 검토 및 난이도 입력</h2>
    <p class="sub">Gemini가 추출한 문항표입니다. 난이도(하/중하/중/중상/상)와 구분을 확인·수정하세요.</p>
    <table class="data-table" id="editTable">
      <thead><tr><th style="width:90px">문항번호</th><th style="width:70px">배점</th>
        <th style="width:120px">구분</th><th style="width:100px">난이도</th><th>${unitLabel}</th></tr></thead>
      <tbody>${STATE.rows.map((r,i)=>rowHTML(r,i,typeOpts)).join("")}</tbody>
    </table>
    <button class="addrow" onclick="addRow()">+ 문항 추가</button>
    <div id="scoreCheck" style="margin-top:12px;font-size:13px"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="STATE.view='input';render()">← 입력 수정</button>
      <button class="btn primary" onclick="goReport()">최종 보고서 도출</button>
    </div>
  </div>`;
  updateScoreCheck();
}
function rowHTML(r,i,typeOpts){
  const typeCell = typeOpts
    ? `<select data-k="type">${typeOpts.map(t=>`<option ${t===r.type?'selected':''}>${t}</option>`).join("")}</select>`
    : `<input type="text" value="${esc(r.type||'')}" data-k="type">`;
  return `<tr data-i="${i}">
    <td><input type="text" value="${esc(r.no)}" data-k="no"></td>
    <td><input type="text" value="${esc(r.score)}" data-k="score" oninput="updateScoreCheck()"></td>
    <td>${typeCell}</td>
    <td><select data-k="diff">${DIFFS.map(d=>`<option ${d===r.diff?'selected':''}>${d}</option>`).join("")}</select></td>
    <td><input type="text" value="${esc(r.unit)}" data-k="unit"></td></tr>`;
}
function addRow(){ readTable(); STATE.rows.push({no:"",score:"",type:(typeOptionsFor()?typeOptionsFor()[0]:""),diff:"중",unit:""}); renderRawEdit(); }
function readTable(){
  const rows=[];
  document.querySelectorAll("#editTable tbody tr").forEach(tr=>{
    const o={}; tr.querySelectorAll("[data-k]").forEach(el=>o[el.dataset.k]=el.value.trim());
    if(o.no||o.score) rows.push(o);
  });
  STATE.rows=rows;
}
function updateScoreCheck(){
  let tot=0; document.querySelectorAll('#editTable [data-k="score"]').forEach(el=>{const v=parseFloat(el.value);if(!isNaN(v))tot+=v;});
  tot=Math.round(tot*10)/10;
  const ok=Math.abs(tot-100)<=0.5;
  $("#scoreCheck").innerHTML=ok?`<span style="color:#16a34a">✓ 배점 합계 ${tot}점</span>`
    :`<span style="color:#d97706">⚠ 배점 합계 ${tot}점 (목표 100점)</span>`;
}
async function goReport(){
  readTable();
  if(!STATE.rows.length) return toast("문항 데이터가 비어 있습니다.");
  loadingScreen("최종 분석 보고서를 생성하고 있습니다…");
  const res=await apiPost({action:"sections", prompt:buildSectionsPrompt(),
    fileBase64:STATE.fileBase64, mimeType:STATE.fileMime});
  if(!res.ok){ toast("생성 오류: "+(res.error||"")); STATE.view="raw"; return render(); }
  try{ STATE.sections=JSON.parse(String(res.text).replace(/```json|```/g,"").trim()); }
  catch(e){ STATE.sections={s2:res.text||"",s3:"",s5:""}; }
  STATE.groupKey=groupKeyOf();
  const ts=new Date(); const p=n=>String(n).padStart(2,'0');
  STATE.reportId=`${STATE.groupKey}_${ts.getFullYear()}${p(ts.getMonth()+1)}${p(ts.getDate())}_${p(ts.getHours())}${p(ts.getMinutes())}${p(ts.getSeconds())}`;
  await apiPost({action:"save", sheetId:STATE.sheetId, id:STATE.reportId, groupKey:STATE.groupKey,
    school:STATE.info.school, grade:STATE.info.grade, subject:STATE.subject,
    detail:STATE.info.subject, units:STATE.info.units, target:STATE.info.target,  // units=배열
    data:{rows:STATE.rows, compare:STATE.compare, academy:STATE.academy},
    s2:STATE.sections.s2, s3:STATE.sections.s3, s5:STATE.sections.s5});
  STATE.view="report"; render();
}

}

// ===== 통계 (난이도 5단계 대응) =====
function computeStats(rows, band){
  const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
  const total=rows.length;
  const typeList=[...new Set(rows.map(r=>r.type))];
  const blank=()=>{const o={총:0};DIFFS.forEach(d=>o[d]=0);return o;};
  const cross={}; typeList.forEach(ty=>cross[ty]=blank());
  const diffTot={}; DIFFS.forEach(d=>diffTot[d]=0);
  rows.forEach(r=>{ if(!cross[r.type])cross[r.type]=blank();
    const d=DIFFS.includes(r.diff)?r.diff:"중";
    cross[r.type][d]=(cross[r.type][d]||0)+1; cross[r.type].총++; diffTot[d]=(diffTot[d]||0)+1; });
  const typeCount={}; typeList.forEach(ty=>typeCount[ty]=cross[ty].총);
  const bandSum={저:0,중:0,고:0}; let scoreTotal=0;
  rows.forEach(r=>{const sc=num(r.score);scoreTotal+=sc;
    if(sc<=band.lo)bandSum.저+=sc; else if(sc>=band.hi)bandSum.고+=sc; else bandSum.중+=sc;});
  const scoreByType={}; const scoreKeys=new Set();
  typeList.forEach(ty=>scoreByType[ty]={});
  rows.forEach(r=>{const k=r.score;scoreKeys.add(k);scoreByType[r.type][k]=(scoreByType[r.type][k]||0)+1;});
  const diffByType={}; typeList.forEach(ty=>{diffByType[ty]={};DIFFS.forEach(d=>diffByType[ty][d]=cross[ty][d]);});
  return {total,typeList,cross,diffTot,typeCount,bandSum,scoreTotal,
    scoreByType,scoreKeys:[...scoreKeys].sort((a,b)=>parseFloat(a)-parseFloat(b)),diffByType};
}

// ===== 차트 =====
function drawCharts(calc){
  const donut=(id,labels,data,colors)=>{
    const el=document.getElementById(id); if(!el)return;
    const tot=data.reduce((a,b)=>a+b,0)||1;
    const cx=90,cy=90,r=70,ir=40; let ang=-Math.PI/2; let paths="";
    data.forEach((v,i)=>{
      const frac=v/tot; if(frac<=0)return;
      const a2=ang+frac*Math.PI*2;
      const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2);
      const xi2=cx+ir*Math.cos(ang),yi2=cy+ir*Math.sin(ang);
      const large=frac>0.5?1:0;
      paths+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${xi1} ${yi1} A${ir} ${ir} 0 ${large} 0 ${xi2} ${yi2} Z" fill="${colors[i%colors.length]}" stroke="#fff" stroke-width="1.5"/>`;
      const mid=(ang+a2)/2, lr=(r+ir)/2;
      const lx=cx+lr*Math.cos(mid),ly=cy+lr*Math.sin(mid);
      if(frac>0.05) paths+=`<text x="${lx}" y="${ly}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">${(frac*100).toFixed(1)}%</text>`;
      ang=a2;
    });
    const legend=labels.map((l,i)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin:0 7px;font-size:11px">
      <span style="width:11px;height:11px;border-radius:2px;background:${colors[i%colors.length]};display:inline-block"></span>${esc(l)}</span>`).join("");
    el.innerHTML=`<svg viewBox="0 0 180 180" width="100%" style="max-height:200px">${paths}</svg>
      <div style="text-align:center;margin-top:4px">${legend}</div>`;
  };
  const blueShades=['#5b8ec9','#9db2d5','#7ea3d0','#b9c8e2','#6f97cc','#aebfdd'];
  // 난이도 5단계 색(연→진)
  const DIFF_COLORS={'하':'#e1d8eb','중하':'#cfc3e2','중':'#c7badd','중상':'#a99bca','상':'#8b7cb8'};
  donut('donutType',calc.typeList,calc.typeList.map(t=>calc.typeCount[t]),blueShades);
  donut('donutDiff',DIFFS,DIFFS.map(d=>calc.diffTot[d]),DIFFS.map(d=>DIFF_COLORS[d]));
  donut('donutBand',['저배점','중배점','고배점'],[calc.bandSum.저,calc.bandSum.중,calc.bandSum.고],['#dcefda','#a9cfa6','#7cb083']);

  const palette=['#4285F4','#EA4335','#FBBC04','#34A853','#FF6D00','#46BDC6','#4C8BF5','#AB47BC'];
  const stackedBar=(id,types,keys,matrix,colorFn)=>{
    const el=document.getElementById(id); if(!el)return;
    const W=760,rowH=46,gap=18,padL=80,padR=20,barW=W-padL-padR;
    const H=types.length*(rowH+gap)+40;
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
    types.forEach((ty,ti)=>{
      const y=ti*(rowH+gap)+6;
      const rowTotal=keys.reduce((a,k)=>a+(matrix[ty][k]||0),0)||1;
      let x=padL;
      svg+=`<text x="${padL-10}" y="${y+rowH/2}" font-size="12" font-weight="600" text-anchor="end" dominant-baseline="middle">${esc(ty)}</text>`;
      keys.forEach((k,ki)=>{
        const v=matrix[ty][k]||0; if(!v)return;
        const w=barW*v/rowTotal;
        svg+=`<rect x="${x}" y="${y}" width="${w}" height="${rowH}" fill="${colorFn(k,ki)}"/>`;
        if(w>34) svg+=`<text x="${x+w/2}" y="${y+rowH/2}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">${(v/rowTotal*100).toFixed(1)}%</text>`;
        x+=w;
      });
    });
    svg+=`</svg>`;
    const legend=keys.map((k,ki)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin:0 7px;font-size:11px">
      <span style="width:11px;height:11px;border-radius:2px;background:${colorFn(k,ki)};display:inline-block"></span>${esc(k)}</span>`).join("");
    el.innerHTML=svg+`<div style="text-align:center;margin-top:8px">${legend}</div>`;
  };
  stackedBar('barScore',calc.typeList,calc.scoreKeys,calc.scoreByType,(k,ki)=>palette[ki%palette.length]);
  stackedBar('barDiff',calc.typeList,DIFFS,calc.diffByType,(k)=>DIFF_COLORS[k]||'#c7badd');
}

function copyShareLink(){
  const url=`${location.origin}${location.pathname}?sheet=${encodeURIComponent(STATE.sheetId)}&report=${encodeURIComponent(STATE.reportId)}&view=readonly`;
  navigator.clipboard?.writeText(url).then(()=>toast("보기 전용 링크가 복사되었습니다."),()=>toast(url));
}

// ---------- 시작 ----------
async function init(){
  const q=new URLSearchParams(location.search);
  const sheet=q.get("sheet"), reportId=q.get("report"), view=q.get("view");
  if(sheet && reportId && view==="readonly"){
    STATE.sheetId=sheet; STATE.readonly=true;
    const res=await apiGet({action:"report",sheetId:sheet,id:reportId});
    if(res.ok && res.record){
      const r=res.record;
      STATE.reportId=r.id; STATE.access=true;
      STATE.academy=r.data.academy||loadAcademy()||{name:"",tel:"",titles:defaultTitles(),band:{lo:4,hi:6.1},books:["하","중하","중","중상","상","최상"]};
      STATE.subject=r.subject; STATE.level=(r.grade||"").includes("중")?"중등":"고등";
      STATE.info={school:r.school,grade:r.grade,subject:r.detail,
        units:Array.isArray(r.units)?r.units:(r.units?String(r.units).split(/[,\n]/).map(x=>x.trim()).filter(Boolean):[]),
        target:r.target};
      STATE.rows=r.data.rows||[]; STATE.compare=r.data.compare||{schools:[]};
      STATE.sections={s2:r.s2,s3:r.s3,s5:r.s5};
      STATE.view="report"; return render();
    }
    toast("리포트를 찾을 수 없습니다.");
  }
  render();
}
function defaultTitles(){return {s1:"1. 학교 시험 난이도 비교 분석",s2:"2. 총평 및 학습전략",
  s3:"3. 문항별 상세 분석",s4:"4. 문제 유형별 출제 현황 분석",s5:"5. 출제 단원 분석"};}
init();
</script>
